name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（pytest + ruff + 合规自检）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 安装依赖（用锁，和本地一致）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      # 覆盖率门槛防止「测试还在加、覆盖率悄悄掉」。
      # 当前基线约 90%，留 5 个点的余量（可选依赖被跳过时会有波动）。
      - name: 测试（覆盖率门槛 85%）
        run: python -m pytest -q --cov=anomaly_lab --cov-report=term --cov-fail-under=85

      - name: 静态检查
        run: python -m ruff check scripts src tests

      - name: 类型检查
        run: python -m mypy

      - name: 合规自检（不出现内部系统专名）
        run: python -m anomaly_lab.cli compliance-check

  frontend:
    name: 前端（vitest + 类型 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 测试
        working-directory: frontend
        run: npm test

      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 构建
        working-directory: frontend
        run: npm run build
