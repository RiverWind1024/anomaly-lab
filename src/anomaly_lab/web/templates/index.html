{% extends "base.html" %}
{% block title %}anomaly-lab{% endblock %}
{% block content %}
<h1>anomaly-lab</h1>
<p>时序异常检测全流程实验室：合成数据 → 形态分类 → 算法推荐 → 检测 → 离线评测 → 回归报告。</p>
<section class="cards">
  <div class="card">
    <h2>数据集</h2>
    <p>当前可用序列：<strong id="series-count">-</strong> 条</p>
    <p><a href="/annotate">进入标注页</a></p>
  </div>
  <div class="card">
    <h2>评测</h2>
    <p>查看最近一次回测报告与 Bad Case。</p>
    <p><a href="/report">进入评估页</a></p>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
fetch('/api/series').then(r => r.json()).then(data => {
  document.getElementById('series-count').textContent = data.length;
});
</script>
{% endblock %}
