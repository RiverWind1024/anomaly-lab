{% extends "base.html" %}
{% block title %}标注 - anomaly-lab{% endblock %}
{% block content %}
<h1>人工标注</h1>
<p>选择序列，在图上框选异常区间；标注以 JSONL 追加保存。</p>
<div class="toolbar">
  <select id="series-select"></select>
  <button id="reload">刷新</button>

</div>
<div id="chart" class="chart"></div>
{% endblock %}
{% block scripts %}
<script src="/static/annotate.js"></script>
{% endblock %}
